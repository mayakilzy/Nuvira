# Nuvira production stack.
#
# Security and isolation:
# - No service publishes a host port.
# - PostgreSQL and Redis are reachable only on the project-internal network.
# - Nginx Proxy Manager reaches frontend/backend through the pre-created
#   external proxy network configured by PROXY_NETWORK.
# - Volumes and the internal network use explicit Nuvira-only names.

name: nuvira

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuvira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nuvira}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuvira} -d ${POSTGRES_DB:-nuvira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: localdev/nuvira-backend:1.0.0
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    image: localdev/nuvira-backend:1.0.0
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5

  frontend:
    image: localdev/nuvira-frontend:1.0.0
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.nuvira.agentcraft.info}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.nuvira.agentcraft.info}
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    name: nuvira_postgres_data
  redis_data:
    name: nuvira_redis_data
  uploads_data:
    name: nuvira_uploads

networks:
  internal:
    name: nuvira_internal
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-hermes-network}
    external: true
